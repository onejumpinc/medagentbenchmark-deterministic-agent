services:
  purple-agent:
    build: .
    platform: linux/amd64
    ports:
      - "9010:9009"
    environment:
      - FHIR_SERVER_URL=${FHIR_SERVER_URL:-http://fhir-server:8080}
    command: ["--host", "0.0.0.0", "--card-url", "http://purple-agent:9009"]
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:9009/.well-known/agent-card.json', timeout=2).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - medagent-network

networks:
  medagent-network:
    name: medagentbenchmark-green_medagent-network
    external: true
